name: Prepare official npm release

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: Reviewed plugin package ID
        type: choice
        required: true
        default: ordiweft-migrations/dashscope
        options:
          - ordiweft-migrations/dashscope
          - ordiweft-examples/doubao-audio
          - ordiweft-migrations/doubao-speech
          - ordiweft-examples/indextts
          - ordiweft-migrations/fish-audio
          - ordiweft-migrations/breeze-tts-api
          - ordiweft-migrations/breeze-tts-local
          - ordiweft-migrations/tapnow
          - ordiweft-migrations/tapnow-web
          - ordiweft-migrations/comfyui
          - ordiweft-migrations/higgsfield
          - ordiweft-migrations/apimart
      version:
        description: Reviewed release version
        type: string
        required: true

permissions:
  contents: read

jobs:
  stage:
    if: github.repository == 'xurunxin/ordiweft-plugins' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: xurunxin/Ordiweft
          ref: 24aa7558d77a5fba1ba009b2bdd045f13fee85e2
          path: host
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: host/go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.20.0"
          package-manager-cache: false
      - name: Check repository and reproduce the approved ZIP
        env:
          PACKAGE_ID: ${{ inputs.package_id }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_ID" =~ ^[a-z0-9-]+/[a-z0-9-]+$ && "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          node scripts/registry.mjs check
          (cd host && go build -mod=readonly -trimpath -o "$RUNNER_TEMP/ordiweft-plugin" ./cmd/ordiweft-plugin)
          "$RUNNER_TEMP/ordiweft-plugin" pack \
            -root "plugins/$PACKAGE_ID/$VERSION/source" \
            -out "$RUNNER_TEMP/plugin.zip"
          node scripts/npm-release.mjs "$PACKAGE_ID" "$VERSION" "$RUNNER_TEMP/plugin.zip" "$RUNNER_TEMP/npm-plugin"
      - name: Submit the package for npm approval
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/npm-plugin"
          npm stage publish --ignore-scripts --access public
